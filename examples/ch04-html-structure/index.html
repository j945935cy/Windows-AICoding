<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Coding 學習筆記</title>
</head>
<body>
  <header>
    <h1>AI Coding 學習筆記</h1>
    <nav aria-label="頁面導覽">
      <a href="#goals">學習目標</a>
      <a href="#notes">筆記</a>
      <a href="#prompts">Prompt</a>
    </nav>
  </header>

  <main>
    <section id="goals">
      <h2>學習目標</h2>
      <ul>
        <li>理解 HTML、CSS、JavaScript 的分工</li>
        <li>學會向 Codex 提出清楚需求</li>
        <li>完成可以展示的小型網頁作品</li>
      </ul>
    </section>

    <section id="notes">
      <h2>今日筆記</h2>
      <article>
        <h3>HTML 負責結構</h3>
        <p>先把內容整理清楚，再交給 CSS 設計樣式。</p>
      </article>
      <article>
        <h3>Prompt 要限制範圍</h3>
        <p>一次只請 Codex 修改一個檔案或一個功能。</p>
      </article>
      <article>
        <h3>完成後要測試</h3>
        <p>AI 產生的程式仍然需要自己在瀏覽器確認。</p>
      </article>
    </section>

    <section id="prompts">
      <h2>常用 Prompt</h2>
      <p>請只產生 HTML，不要加入 CSS 和 JavaScript。</p>
    </section>
  </main>

  <footer>
    <p>只使用 HTML 的範例頁。</p>
  </footer>
</body>
</html>
